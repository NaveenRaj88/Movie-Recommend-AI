spring.application.name=Data-ingester

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres


# Turns on JSON console logging (Spring Boot 3.4+)
#logging.structured.format.console=ecs

# Ensures 100% of HTTP requests generate a traceId
management.tracing.sampling.probability=1.0


spring.mvc.problemdetails.enabled=true

management.otlp.metrics.export.enabled=false
management.otlp.tracing.export.enabled=false

# kafka properties

spring.kafka.bootstrap-servers=localhost:9092

# 1. Producer Config (JSON Serialization)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# 2. Consumer Config (Batch Listener + Manual Offset Commit)

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.movie.dataingester.model



# 3. Enable Batch Listening & OpenTelemetry Trace Propagation
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=manual
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ollama configs
#langchain4j.ollama.embedding-model.base-url=http://localhost:11434
#langchain4j.ollama.embedding-model.model-name=nomic-embed-text
langchain4j.ollama.embedding-model.timeout=120s